<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}九麦NBA范特西联赛 ELO排名系统{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.3rem;
        }
        .elo-positive {
            color: #28a745;
            font-weight: bold;
        }
        .elo-negative {
            color: #dc3545;
            font-weight: bold;
        }
        .elo-neutral {
            color: #6c757d;
        }
        .card-header {
            font-weight: 600;
        }
        footer {
            margin-top: 50px;
            padding: 20px 0;
            background-color: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="bi bi-trophy-fill"></i> 九麦NBA范特西联赛
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">
                            <i class="bi bi-house-fill"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'leagues' %}active{% endif %}" href="{{ url_for('leagues') }}">
                            <i class="bi bi-diagram-3-fill"></i> 联赛对比
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'matches' %}active{% endif %}" href="{{ url_for('matches') }}">
                            <i class="bi bi-calendar-event"></i> 比赛记录
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'weekly_elo' %}active{% endif %}" href="{{ url_for('weekly_elo') }}">
                            <i class="bi bi-graph-up"></i> 每周变化
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'algorithm' %}active{% endif %}" href="{{ url_for('algorithm') }}">
                            <i class="bi bi-calculator-fill"></i> 算法详解
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="text-center text-muted">
        <div class="container">
            <p class="mb-1">
                <i class="bi bi-star-fill text-warning"></i> 
                九麦NBA范特西联赛 ELO排名系统 V2.0
                <i class="bi bi-star-fill text-warning"></i>
            </p>
            <p class="mb-0 small">
                北斗五星联赛体系：天枢盟 | 天璇盟 | 天玑盟 | 天权盟 | 玉衡盟
            </p>
            <p class="mb-0 small text-secondary">
                Powered by Python Flask & SQLite | © 2026
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
