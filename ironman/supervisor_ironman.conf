# Supervisor配置文件
# 路径: /etc/supervisor/conf.d/ironman.conf

[program:ironman]
command=/var/www/ironman/venv/bin/gunicorn --bind 127.0.0.1:5001 --workers 2 --timeout 60 ironman_app:app
directory=/var/www/ironman
user=ubuntu
autostart=true
autorestart=true
stderr_logfile=/var/log/ironman.err.log
stdout_logfile=/var/log/ironman.out.log
environment=PATH="/var/www/ironman/venv/bin"

# 日志配置
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
