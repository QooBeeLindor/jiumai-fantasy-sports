<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>铁人团队赛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .landing-container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .trophy-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 36px;
            color: #2d3748;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 18px;
            color: #718096;
            margin-bottom: 30px;
        }

        .sports-list {
            font-size: 20px;
            color: #4a5568;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 48px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .info {
            margin-top: 30px;
            font-size: 14px;
            color: #a0aec0;
        }

        @media (max-width: 600px) {
            .landing-container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 16px;
            }

            .sports-list {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div class="trophy-icon">🏆</div>
        <h1>铁人团队赛</h1>
        <p class="subtitle">挑战五大联赛，争夺铁人至尊荣耀</p>
        <div class="sports-list">MLB · NFL · NHL · NBA · EPL</div>
        <a href="/irongroup/leaderboard" class="cta-button">查看排行榜</a>
        <p class="info">12支战队 · 5个项目 · 团队荣耀</p>
    </div>
</body>
</html>
